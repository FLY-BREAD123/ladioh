services:
  - type: web
    name: void-radio
    runtime: static

    # 빌드 도구 없이 HTML 한 장이라 빌드 단계가 없습니다.
    buildCommand: echo "no build step"

    # 저장소 루트를 그대로 게시합니다.
    staticPublishPath: .

    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

    # 단일 페이지라 모든 경로를 index.html로 보냅니다.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
