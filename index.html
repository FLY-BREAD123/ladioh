<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOID.RADIO — 실시간 인터넷 라디오</title>
<meta name="description" content="전 세계 인터넷 라디오를 눈금판으로 돌려 듣는 흑백 플레이어.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:title" content="VOID.RADIO">
<meta property="og:description" content="전 세계 인터넷 라디오를 눈금판으로 돌려 듣는 흑백 플레이어.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@200;300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;
  --fg:#fff;
  --d1:rgba(255,255,255,.62);
  --d2:rgba(255,255,255,.38);
  --d3:rgba(255,255,255,.20);
  --line:rgba(255,255,255,.11);
  --line2:rgba(255,255,255,.055);
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
  --kr:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--fg);font-family:var(--kr);
  min-height:100vh;overflow-x:hidden;
}
::selection{background:#fff;color:#000}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit;color:inherit;background:none;border:none;outline:none}
:focus-visible{outline:1px solid #fff;outline-offset:3px}

/* 스캔라인 + 스윕 */
.scan{
  position:fixed;inset:0;z-index:60;pointer-events:none;
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.035) 0 1px,transparent 1px 4px);
  mix-blend-mode:overlay;
}
.sweep{
  position:fixed;left:0;right:0;height:180px;z-index:59;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(255,255,255,.045),transparent);
  animation:sweep 11s linear infinite;
}
@keyframes sweep{0%{top:-200px}100%{top:110%}}
.glow{
  position:fixed;left:50%;top:-28vh;width:130vw;height:78vh;transform:translateX(-50%);
  z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,rgba(255,255,255,.085),transparent 62%);
  opacity:.3;transition:opacity .5s ease;
}
body.playing .glow{opacity:1}

/* 레이아웃 */
.app{
  position:relative;z-index:1;
  max-width:1180px;margin:0 auto;padding:26px clamp(18px,4vw,40px) 60px;
}
.app>*{animation:rise .8s var(--ease) backwards}
.app>*:nth-child(1){animation-delay:.05s}
.app>*:nth-child(2){animation-delay:.14s}
.app>*:nth-child(3){animation-delay:.23s}
.app>*:nth-child(4){animation-delay:.32s}
.app>*:nth-child(5){animation-delay:.41s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}

/* 헤더 */
.rail{display:flex;align-items:center;gap:16px;padding-bottom:20px}
.logo{font-family:var(--mono);font-size:14px;font-weight:700;letter-spacing:.28em}
.logo span{font-weight:200;opacity:.55}
.rail .fill{flex:1;height:1px;background:var(--line)}
.status{
  display:flex;align-items:center;gap:8px;font-family:var(--mono);
  font-size:10.5px;letter-spacing:.22em;color:var(--d2);white-space:nowrap;
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--d3);transition:.3s}
body.playing .dot{background:#fff;box-shadow:0 0 0 0 rgba(255,255,255,.7);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.clock{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--d3);font-variant-numeric:tabular-nums}

/* 현재 방송 */
.now{
  display:flex;align-items:flex-end;gap:clamp(20px,4vw,48px);
  padding:clamp(26px,5vh,54px) 0 clamp(22px,4vh,38px);
  border-bottom:1px solid var(--line);
}
.now-main{flex:1;min-width:0}
.eyebrow{
  font-family:var(--mono);font-size:10px;letter-spacing:.28em;color:var(--d3);
  margin-bottom:clamp(12px,2vh,20px);
}
.title-wrap{overflow:hidden;position:relative;height:clamp(40px,9.5vw,104px)}
.title{
  font-size:clamp(32px,8.2vw,92px);font-weight:800;letter-spacing:-.045em;line-height:1.05;
  white-space:nowrap;position:absolute;left:0;top:0;
  transition:opacity .35s ease,transform .5s var(--ease);
}
.title.out{opacity:0;transform:translateY(-16px)}
.title.scroll{animation:marq 18s linear infinite}
@keyframes marq{
  0%,12%{transform:translateX(0)}
  88%,100%{transform:translateX(var(--shift,0))}
}
.sub{
  margin-top:clamp(10px,1.8vh,16px);display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;
  font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--d2);min-height:16px;
}
.sub b{font-weight:400;color:var(--d1)}
.sub i{font-style:normal;color:var(--d3)}

/* VU */
.vu-box{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.vu-cap{font-family:var(--mono);font-size:9.5px;letter-spacing:.26em;color:var(--d3)}
#vu{width:clamp(120px,17vw,208px);height:clamp(44px,7vh,64px);display:block}

/* 밴드 */
.band-wrap{position:relative;border-bottom:1px solid var(--line)}
.band{
  position:relative;height:clamp(96px,14vh,126px);cursor:grab;touch-action:pan-y;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);
}
.band:active{cursor:grabbing}
#bandc{position:absolute;inset:0;width:100%;height:100%}
.needle{
  position:absolute;left:50%;top:8px;bottom:8px;width:1px;background:#fff;
  transform:translateX(-.5px);pointer-events:none;
}
.needle::before,.needle::after{
  content:'';position:absolute;left:-4px;border-left:4.5px solid transparent;border-right:4.5px solid transparent;
}
.needle::before{top:-1px;border-top:6px solid #fff}
.needle::after{bottom:-1px;border-bottom:6px solid #fff}
.band-hint{
  position:absolute;left:0;bottom:6px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.2em;color:var(--d3);pointer-events:none;transition:opacity .5s ease;
}

/* 트랜스포트 */
.transport{
  display:flex;align-items:center;gap:clamp(14px,2.4vw,26px);
  padding:clamp(18px,3vh,26px) 0;border-bottom:1px solid var(--line);
}
.skip{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  color:var(--d2);transition:.25s var(--ease);
}
.skip:hover{color:#fff;background:rgba(255,255,255,.07)}
.skip svg{width:15px;height:15px;fill:currentColor}
.play{
  position:relative;width:clamp(58px,7vw,72px);aspect-ratio:1;border-radius:50%;
  border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;
  transition:.3s var(--ease);flex:0 0 auto;
}
.play:hover{border-color:#fff;background:rgba(255,255,255,.06)}
.play:active{transform:scale(.95)}
.play svg{width:20px;height:20px;fill:#fff}
.play .ring{
  position:absolute;inset:-1px;border-radius:50%;border:1px solid transparent;
  border-top-color:#fff;opacity:0;transition:opacity .3s;
}
body.loading .play .ring{opacity:1;animation:spin .85s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tp-fill{flex:1}
.vol{display:flex;align-items:center;gap:11px}
.vol label{font-family:var(--mono);font-size:9.5px;letter-spacing:.24em;color:var(--d3)}
.vol input[type=range]{
  -webkit-appearance:none;appearance:none;width:clamp(76px,11vw,124px);height:1px;
  background:var(--d3);cursor:pointer;
}
.vol input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:#fff;cursor:pointer;
}
.vol input[type=range]::-moz-range-thumb{width:10px;height:10px;border:0;border-radius:50%;background:#fff;cursor:pointer}

/* 브라우저 */
.browse{padding-top:clamp(22px,3.6vh,34px)}
.tools{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--d2);
  padding:7px 13px;border:1px solid var(--line);border-radius:100px;transition:.25s var(--ease);
}
.tab:hover{color:#fff;border-color:rgba(255,255,255,.3)}
.tab.on{background:#fff;color:#000;border-color:#fff}
.search{
  display:flex;align-items:center;gap:9px;margin-left:auto;
  border-bottom:1px solid var(--line);padding:6px 2px;min-width:190px;flex:1;max-width:290px;
  transition:border-color .3s;
}
.search:focus-within{border-color:#fff}
.search svg{width:13px;height:13px;stroke:var(--d3);fill:none;stroke-width:1.6;flex:0 0 auto}
.search input{width:100%;font-size:13.5px;letter-spacing:-.01em}
.search input::placeholder{color:var(--d3)}

.list{border-top:1px solid var(--line2)}
.row{
  display:flex;align-items:center;gap:14px;padding:13px 4px 13px 0;
  border-bottom:1px solid var(--line2);cursor:pointer;position:relative;
  transition:padding-left .3s var(--ease),background .3s;
}
.row::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:#fff;
  transform:scaleY(0);transition:transform .3s var(--ease);
}
.row:hover{padding-left:14px;background:rgba(255,255,255,.028)}
.row:hover::before{transform:scaleY(1)}
.row.on{padding-left:14px}
.row.on::before{transform:scaleY(1)}
.row.dead{opacity:.3}
.row.dead .r-name{text-decoration:line-through}
.r-idx{
  font-family:var(--mono);font-size:10px;color:var(--d3);width:26px;flex:0 0 auto;
  font-variant-numeric:tabular-nums;
}
.row.on .r-idx{color:#fff}
.r-body{flex:1;min-width:0}
.r-name{
  font-size:14.5px;font-weight:600;letter-spacing:-.015em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.r-meta{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--d3);margin-top:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.r-bars{display:flex;align-items:flex-end;gap:2px;height:13px;width:15px;flex:0 0 auto;opacity:0;transition:.3s}
.row.on .r-bars{opacity:1}
.r-bars i{width:2px;background:#fff;height:30%;animation:eq .9s ease-in-out infinite}
.r-bars i:nth-child(2){animation-delay:.24s}
.r-bars i:nth-child(3){animation-delay:.47s}
@keyframes eq{0%,100%{height:22%}50%{height:100%}}
body:not(.playing) .r-bars i{animation-play-state:paused}
.fav{
  width:30px;height:30px;flex:0 0 auto;display:grid;place-items:center;
  color:var(--d3);transition:.25s;
}
.fav:hover{color:#fff;transform:scale(1.15)}
.fav svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.5}
.fav.on{color:#fff}
.fav.on svg{fill:#fff}

.state{
  padding:52px 0;text-align:center;font-size:13.5px;color:var(--d2);line-height:1.9;
}
.state b{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.24em;color:var(--d3);margin-bottom:12px;font-weight:400}
.state button{
  margin-top:18px;font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;
  border:1px solid var(--line);border-radius:100px;padding:10px 22px;transition:.25s;
}
.state button:hover{border-color:#fff}
.state .load{display:inline-flex;gap:5px}
.state .load i{width:4px;height:4px;border-radius:50%;background:var(--d2);animation:bounce 1.3s ease-in-out infinite}
.state .load i:nth-child(2){animation-delay:.16s}
.state .load i:nth-child(3){animation-delay:.32s}
@keyframes bounce{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-5px)}}

.foot{
  margin-top:40px;padding-top:18px;border-top:1px solid var(--line2);
  font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--d3);line-height:2;
}
.foot a{color:var(--d2);text-decoration:none;border-bottom:1px solid var(--line)}
.foot a:hover{color:#fff}

@media (max-width:760px){
  .vu-box{display:none}
  .now{padding:26px 0 20px}
  .search{margin-left:0;max-width:none;order:-1;width:100%}
  .tools{gap:10px}
  .r-meta{font-size:9.5px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .sweep{display:none}
}
</style>
</head>
<body>

<div class="glow"></div>
<div class="sweep"></div>
<div class="scan"></div>

<div class="app">

  <header class="rail">
    <div class="logo">VOID<span>.RADIO</span></div>
    <div class="fill"></div>
    <div class="status"><span class="dot" id="dot"></span><span id="status">대기 중</span></div>
    <div class="clock" id="clock">--:--:--</div>
  </header>

  <section class="now">
    <div class="now-main">
      <div class="eyebrow" id="eyebrow">지금 재생 중</div>
      <div class="title-wrap"><h1 class="title" id="title">방송국을 선택하세요</h1></div>
      <div class="sub" id="sub"><i>아래 목록에서 고르거나 눈금을 드래그하세요</i></div>
    </div>
    <div class="vu-box">
      <div class="vu-cap">SIGNAL</div>
      <canvas id="vu"></canvas>
    </div>
  </section>

  <section class="band-wrap">
    <div class="band" id="band" tabindex="0" role="slider" aria-label="방송국 눈금" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
      <canvas id="bandc"></canvas>
      <div class="needle"></div>
      <div class="band-hint" id="hint">드래그해서 이동 · ←→ 키</div>
    </div>
  </section>

  <section class="transport">
    <button class="skip" id="prev" aria-label="이전 방송국">
      <svg viewBox="0 0 24 24"><path d="M6 5h2.5v14H6zM20 5l-11 7 11 7z"/></svg>
    </button>
    <button class="play" id="play" aria-label="재생">
      <span class="ring"></span>
      <svg id="play-ico" viewBox="0 0 24 24"><path d="M7 4.5l13 7.5-13 7.5z"/></svg>
    </button>
    <button class="skip" id="next" aria-label="다음 방송국">
      <svg viewBox="0 0 24 24"><path d="M15.5 5H18v14h-2.5zM4 5l11 7-11 7z"/></svg>
    </button>
    <div class="tp-fill"></div>
    <div class="vol">
      <label for="vol">VOL</label>
      <input id="vol" type="range" min="0" max="100" value="80" aria-label="음량">
    </div>
  </section>

  <section class="browse">
    <div class="tools">
      <div class="tabs" id="tabs"></div>
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
        <input id="q" type="search" placeholder="방송국 이름 검색" autocomplete="off">
      </div>
    </div>
    <div class="list" id="list"></div>
    <div class="foot">
      방송국 정보 · <a href="https://www.radio-browser.info" target="_blank" rel="noopener">Radio Browser</a> 커뮤니티 데이터베이스<br>
      오디오는 각 방송국 서버에서 직접 재생됩니다. HTTPS 스트림만 표시됩니다.
    </div>
  </section>

</div>

<script>
(function(){
'use strict';

/* ── API ─────────────────────────────────────────── */
const HOSTS = [
  'https://de1.api.radio-browser.info',
  'https://de2.api.radio-browser.info',
  'https://nl1.api.radio-browser.info',
  'https://at1.api.radio-browser.info'
];
let host = HOSTS[0];

async function api(path){
  let lastErr;
  for(const h of HOSTS){
    try{
      const ctl = new AbortController();
      const to = setTimeout(()=>ctl.abort(), 9000);
      const r = await fetch(h + path, {signal:ctl.signal});
      clearTimeout(to);
      if(!r.ok) throw new Error(r.status);
      host = h;
      return await r.json();
    }catch(e){ lastErr = e; }
  }
  throw lastErr || new Error('unreachable');
}

const TABS = [
  {id:'kr',   label:'한국',    q:'?countrycode=KR'},
  {id:'top',  label:'인기',    q:'?'},
  {id:'jazz', label:'재즈',    q:'?tagList=jazz'},
  {id:'lofi', label:'로파이',  q:'?tagList=lofi'},
  {id:'amb',  label:'앰비언트',q:'?tagList=ambient'},
  {id:'cls',  label:'클래식',  q:'?tagList=classical'},
  {id:'news', label:'뉴스',    q:'?tagList=news'},
  {id:'fav',  label:'즐겨찾기',q:null}
];

/* ── 상태 ────────────────────────────────────────── */
let list = [], idx = -1, tab = 'kr';
let playing = false, loading = false;
let favs = new Map();   // uuid -> station
let dead = new Set();
let bandPos = 0, bandTarget = 0, dragging = false;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

const audio = new Audio();
audio.preload = 'none';
audio.volume = .8;

const $ = id => document.getElementById(id);
const el = {
  status:$('status'), title:$('title'), sub:$('sub'), eyebrow:$('eyebrow'),
  list:$('list'), tabs:$('tabs'), band:$('band'), hint:$('hint'),
  play:$('play'), ico:$('play-ico'), clock:$('clock'), q:$('q')
};

/* ── 저장소 (즐겨찾기) ───────────────────────────── */
async function loadFavs(){
  if(!window.storage) return;
  try{
    const r = await window.storage.get('favs');
    if(r && r.value) JSON.parse(r.value).forEach(s => favs.set(s.stationuuid, s));
  }catch(e){ /* 없음 */ }
}
async function saveFavs(){
  if(!window.storage) return;
  try{ await window.storage.set('favs', JSON.stringify([...favs.values()])); }catch(e){}
}

/* ── 목록 로드 ───────────────────────────────────── */
function clean(arr){
  const seen = new Set(), out = [];
  for(const s of arr){
    const u = s.url_resolved || s.url;
    if(!u || !u.startsWith('https://')) continue;   // 혼합 콘텐츠 차단 회피
    if(s.hls === 1) continue;
    const key = (s.name||'').trim().toLowerCase();
    if(!key || seen.has(key)) continue;
    seen.add(key);
    out.push({
      stationuuid:s.stationuuid, name:(s.name||'이름 없음').trim(), url:u,
      country:s.country||'', state:s.state||'', tags:s.tags||'',
      codec:s.codec||'', bitrate:s.bitrate||0, homepage:s.homepage||''
    });
    if(out.length >= 60) break;
  }
  return out;
}

function showState(html){ el.list.innerHTML = '<div class="state">'+html+'</div>'; }

async function load(which, term){
  tab = which;
  paintTabs();

  if(which === 'fav'){
    list = [...favs.values()];
    if(!list.length) showState('<b>즐겨찾기 없음</b>목록에서 별표를 눌러 저장해 두면 여기에 모입니다.');
    else paintList();
    resetBand();
    return;
  }

  showState('<b>불러오는 중</b><span class="load"><i></i><i></i><i></i></span>');

  const base = term
    ? '/json/stations/search?name=' + encodeURIComponent(term)
    : '/json/stations/search' + (TABS.find(t=>t.id===which).q);
  const path = base + (base.endsWith('?') ? '' : '&') + 'hidebroken=true&order=clickcount&reverse=true&limit=250';

  try{
    const raw = await api(path);
    list = clean(raw);
    if(!list.length){
      showState('<b>결과 없음</b>' + (term
        ? '다른 이름으로 검색해 보세요.'
        : 'HTTPS로 방송하는 방송국이 이 분류에 없습니다. 다른 분류를 골라 보세요.'));
    }else{
      paintList();
    }
  }catch(e){
    showState('<b>연결 실패</b>방송국 목록 서버에 닿지 못했습니다.<br>네트워크를 확인하고 다시 시도하세요.<button id="retry">다시 시도</button>');
    const r = $('retry'); if(r) r.onclick = ()=>load(which, term);
  }
  resetBand();
}

function resetBand(){
  idx = -1; bandPos = bandTarget = 0;
  el.band.setAttribute('aria-valuemax', Math.max(0, list.length-1));
}

/* ── 목록 렌더 ───────────────────────────────────── */
function paintTabs(){
  el.tabs.innerHTML = '';
  for(const t of TABS){
    const b = document.createElement('button');
    b.className = 'tab' + (t.id===tab ? ' on' : '');
    b.textContent = t.label + (t.id==='fav' && favs.size ? ' '+favs.size : '');
    b.onclick = ()=>{ el.q.value=''; load(t.id); };
    el.tabs.appendChild(b);
  }
}

function metaOf(s){
  const bits = [];
  if(s.country) bits.push(s.country);
  if(s.state) bits.push(s.state);
  if(s.bitrate) bits.push(s.bitrate + 'k');
  if(s.codec) bits.push(s.codec.toUpperCase());
  const tg = s.tags.split(',').filter(Boolean).slice(0,3).join(' · ');
  if(tg) bits.push(tg);
  return bits.join('  ·  ');
}

function paintList(){
  el.list.innerHTML = '';
  list.forEach((s,i)=>{
    const row = document.createElement('div');
    row.className = 'row' + (i===idx?' on':'') + (dead.has(s.stationuuid)?' dead':'');
    row.tabIndex = 0;
    row.innerHTML =
      '<span class="r-idx">'+String(i+1).padStart(2,'0')+'</span>'+
      '<span class="r-body"><span class="r-name"></span><span class="r-meta"></span></span>'+
      '<span class="r-bars"><i></i><i></i><i></i></span>'+
      '<button class="fav'+(favs.has(s.stationuuid)?' on':'')+'" aria-label="즐겨찾기">'+
        '<svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.9.9-4.2 4.1 1 5.8-5.3-2.8-5.3 2.8 1-5.8L3.5 9.7l5.9-.9z"/></svg>'+
      '</button>';
    row.querySelector('.r-name').textContent = s.name;
    row.querySelector('.r-meta').textContent = metaOf(s);
    row.onclick = e => { if(e.target.closest('.fav')) return; select(i, true); };
    row.onkeydown = e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); select(i,true); } };
    row.querySelector('.fav').onclick = e => {
      e.stopPropagation();
      const btn = e.currentTarget;
      if(favs.has(s.stationuuid)){ favs.delete(s.stationuuid); btn.classList.remove('on'); }
      else { favs.set(s.stationuuid, s); btn.classList.add('on'); }
      saveFavs(); paintTabs();
      if(tab==='fav') load('fav');
    };
    el.list.appendChild(row);
  });
}

function markRows(){
  [...el.list.children].forEach((r,i)=>{
    if(!r.classList.contains('row')) return;
    r.classList.toggle('on', i===idx);
    r.classList.toggle('dead', dead.has(list[i] && list[i].stationuuid));
  });
}

/* ── 재생 ────────────────────────────────────────── */
let playTimer = null;

function select(i, autoplay){
  if(i < 0 || i >= list.length) return;
  idx = i; bandTarget = i;
  markRows();
  el.band.setAttribute('aria-valuenow', i);
  const s = list[i];

  el.title.classList.add('out');
  setTimeout(()=>{
    el.title.textContent = s.name;
    el.title.classList.remove('out');
    fitTitle();
  }, 180);

  el.eyebrow.textContent = autoplay ? '지금 재생 중' : '선택됨';
  el.sub.innerHTML = '';
  const parts = [];
  if(s.country) parts.push('<b>'+esc(s.country)+(s.state?' · '+esc(s.state):'')+'</b>');
  if(s.bitrate) parts.push(esc(s.bitrate+'kbps '+(s.codec||'').toUpperCase()));
  const tg = s.tags.split(',').filter(Boolean).slice(0,3).map(esc).join(' · ');
  if(tg) parts.push('<i>'+tg+'</i>');
  el.sub.innerHTML = parts.join('<span style="opacity:.25">/</span>');

  if(autoplay) start(s);
}

function esc(t){ return String(t).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function start(s){
  clearTimeout(playTimer);
  setLoading(true);
  setStatus('연결 중');
  audio.src = s.url;
  audio.load();
  audio.play().catch(()=> fail('재생 차단됨'));

  // 응답 없는 스트림 정리
  playTimer = setTimeout(()=>{ if(!playing) fail('응답 없음'); }, 13000);

  // 인기도 집계 (Radio Browser 권장)
  fetch(host + '/json/url/' + s.stationuuid).catch(()=>{});
}

function fail(msg){
  clearTimeout(playTimer);
  setLoading(false); setPlaying(false);
  setStatus(msg);
  if(list[idx]){ dead.add(list[idx].stationuuid); markRows(); }
  el.sub.innerHTML = '<i>이 방송국은 응답하지 않습니다. 다음 방송국을 시도하세요.</i>';
}

function setStatus(t){ el.status.textContent = t; }
function setLoading(v){ loading = v; document.body.classList.toggle('loading', v); }
function setPlaying(v){
  playing = v;
  document.body.classList.toggle('playing', v);
  el.play.setAttribute('aria-label', v ? '일시정지' : '재생');
  el.ico.innerHTML = v
    ? '<path d="M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z"/>'
    : '<path d="M7 4.5l13 7.5-13 7.5z"/>';
}

audio.addEventListener('playing', ()=>{ clearTimeout(playTimer); setLoading(false); setPlaying(true); setStatus('수신 중'); });
audio.addEventListener('waiting', ()=>{ setLoading(true); setStatus('버퍼링'); });
audio.addEventListener('pause',   ()=>{ setPlaying(false); if(!loading) setStatus('일시정지'); });
audio.addEventListener('error',   ()=> fail('스트림 오류'));
audio.addEventListener('stalled', ()=> setStatus('신호 불안정'));

el.play.onclick = ()=>{
  if(idx < 0){ if(list.length) select(0, true); return; }
  if(playing){ audio.pause(); }
  else if(audio.src){ setLoading(true); audio.play().catch(()=>fail('재생 차단됨')); }
  else start(list[idx]);
};
$('prev').onclick = ()=> select(idx <= 0 ? list.length-1 : idx-1, true);
$('next').onclick = ()=> select(idx >= list.length-1 ? 0 : idx+1, true);
$('vol').oninput = e => { audio.volume = e.target.value/100; };

/* ── 제목 마퀴 ───────────────────────────────────── */
function fitTitle(){
  el.title.classList.remove('scroll');
  requestAnimationFrame(()=>{
    const over = el.title.scrollWidth - el.title.parentElement.clientWidth;
    if(over > 8 && !reduce){
      el.title.style.setProperty('--shift', (-over-12)+'px');
      el.title.classList.add('scroll');
    }else{
      el.title.style.removeProperty('--shift');
    }
  });
}

/* ── 눈금 밴드 ───────────────────────────────────── */
const bc = $('bandc'), bx = bc.getContext('2d');
const PX = 156;
let bw = 0, bh = 0;

function sizeBand(){
  const r = el.band.getBoundingClientRect(), d = Math.min(devicePixelRatio||1, 2);
  bw = r.width; bh = r.height;
  bc.width = bw*d; bc.height = bh*d;
  bx.setTransform(d,0,0,d,0,0);
}

function drawBand(){
  if(!bw || !bh) return;
  bx.clearRect(0,0,bw,bh);
  const cx = bw/2, span = cx/PX + 1.2;

  // 미세 눈금
  bx.lineWidth = 1;
  const kStart = Math.floor((bandPos - span)*5), kEnd = Math.ceil((bandPos + span)*5);
  for(let k=kStart;k<=kEnd;k++){
    if(k % 5 === 0) continue;
    const x = Math.round(cx + (k/5 - bandPos)*PX) + .5;
    if(x < -10 || x > bw+10) continue;
    bx.strokeStyle = 'rgba(255,255,255,.16)';
    bx.beginPath(); bx.moveTo(x, 14); bx.lineTo(x, 26); bx.stroke();
  }

  // 방송국 눈금 + 이름
  const from = Math.max(0, Math.floor(bandPos - span));
  const to   = Math.min(list.length-1, Math.ceil(bandPos + span));
  for(let j=from;j<=to;j++){
    const s = list[j];
    if(!s) continue;
    const x = cx + (j - bandPos)*PX;
    const d = Math.abs(j - bandPos);
    const a = Math.max(0, 1 - d/span);
    const sharp = Math.max(0, 1 - d);

    bx.strokeStyle = 'rgba(255,255,255,'+(a*(.28 + sharp*.72)).toFixed(3)+')';
    bx.lineWidth = 1;
    bx.beginPath();
    bx.moveTo(Math.round(x)+.5, 10);
    bx.lineTo(Math.round(x)+.5, 34 + sharp*10);
    bx.stroke();

    bx.textAlign = 'center';
    bx.fillStyle = 'rgba(255,255,255,'+(a*(.2 + sharp*.8)).toFixed(3)+')';
    bx.font = '400 10px "JetBrains Mono", monospace';
    bx.fillText(String(j+1).padStart(2,'0'), x, bh-30);

    bx.fillStyle = 'rgba(255,255,255,'+(a*(.16 + sharp*.84)).toFixed(3)+')';
    bx.font = (sharp>.6?'700 ':'500 ') + (12 + sharp*3).toFixed(1) + 'px "Pretendard Variable", Pretendard, sans-serif';
    let n = s.name;
    if(n.length > 17) n = n.slice(0,16) + '…';
    bx.fillText(n, x, bh-11);
  }

  if(!list.length){
    bx.textAlign = 'center';
    bx.fillStyle = 'rgba(255,255,255,.2)';
    bx.font = '300 11px "JetBrains Mono", monospace';
    bx.fillText('NO STATIONS', cx, bh/2 + 4);
  }
}

/* 드래그 */
let dragX = 0, dragStart = 0, moved = 0;
el.band.addEventListener('pointerdown', e=>{
  if(!list.length) return;
  dragging = true; el.band.setPointerCapture(e.pointerId);
  dragX = e.clientX; dragStart = bandPos; moved = 0;
  el.hint.style.opacity = 0;
});
el.band.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const dx = e.clientX - dragX;
  moved = Math.max(moved, Math.abs(dx));
  bandPos = Math.min(list.length-1, Math.max(0, dragStart - dx/PX));
  bandTarget = bandPos;
});
function endDrag(){
  if(!dragging) return;
  dragging = false;
  const i = Math.round(bandPos);
  bandTarget = i;
  if(moved > 4) select(i, true);
}
el.band.addEventListener('pointerup', endDrag);
el.band.addEventListener('pointercancel', ()=>{ dragging = false; bandTarget = Math.round(bandPos); });
el.band.addEventListener('wheel', e=>{
  if(!list.length) return;
  e.preventDefault();
  bandTarget = Math.min(list.length-1, Math.max(0, Math.round(bandTarget + (e.deltaY>0?1:-1))));
  el.hint.style.opacity = 0;
  clearTimeout(el.band._w);
  el.band._w = setTimeout(()=> select(Math.round(bandTarget), true), 320);
}, {passive:false});

/* 키보드 */
addEventListener('keydown', e=>{
  if(e.target.tagName === 'INPUT') return;
  if(e.key === 'ArrowRight'){ e.preventDefault(); $('next').click(); el.hint.style.opacity=0; }
  else if(e.key === 'ArrowLeft'){ e.preventDefault(); $('prev').click(); el.hint.style.opacity=0; }
  else if(e.code === 'Space'){ e.preventDefault(); el.play.click(); }
});

/* ── VU ──────────────────────────────────────────── */
const vc = $('vu'), vx = vc.getContext('2d');
const N = 26;
let vu = new Array(N).fill(0), pk = new Array(N).fill(0);
let vw = 0, vh = 0;

function sizeVU(){
  const r = vc.getBoundingClientRect(), d = Math.min(devicePixelRatio||1, 2);
  vw = r.width; vh = r.height;
  vc.width = vw*d; vc.height = vh*d;
  vx.setTransform(d,0,0,d,0,0);
}
function drawVU(t){
  if(!vw || !vh) return;
  vx.clearRect(0,0,vw,vh);
  const bwd = vw/N;
  for(let i=0;i<N;i++){
    let target = 0;
    if(playing){
      const a = Math.sin(t*1.7 + i*.55)*.5 + .5;
      const b = Math.sin(t*.63 + i*.21)*.5 + .5;
      const c = Math.sin(t*3.4 + i*1.3)*.5 + .5;
      target = (.18 + (a*.55 + b*.3 + c*.15)*.82) * (1 - i/(N*1.9)) * (.72 + Math.random()*.38);
    }
    vu[i] += (target - vu[i]) * (target > vu[i] ? .55 : .1);
    pk[i] = Math.max(pk[i] - .0075, vu[i]);
    const h = Math.max(1, vu[i]*vh);
    vx.fillStyle = 'rgba(255,255,255,'+(.34 + vu[i]*.66).toFixed(3)+')';
    vx.fillRect(i*bwd, vh-h, bwd-1.6, h);
    if(pk[i] > .04){
      vx.fillStyle = 'rgba(255,255,255,.5)';
      vx.fillRect(i*bwd, vh - pk[i]*vh - 1, bwd-1.6, 1);
    }
  }
  vx.fillStyle = 'rgba(255,255,255,.14)';
  vx.fillRect(0, vh-1, vw, 1);
}

/* ── 루프 ────────────────────────────────────────── */
function loop(now){
  requestAnimationFrame(loop);
  const t = now/1000;
  if(!dragging) bandPos += (bandTarget - bandPos) * .12;
  drawBand();
  drawVU(t);
}

/* ── 검색 ────────────────────────────────────────── */
let qTimer;
el.q.addEventListener('input', e=>{
  clearTimeout(qTimer);
  const v = e.target.value.trim();
  qTimer = setTimeout(()=>{
    if(v.length >= 2) load('search', v);
    else if(!v) load('kr');
  }, 420);
});

/* ── 시계 ────────────────────────────────────────── */
setInterval(()=>{
  const d = new Date(), p = n => String(n).padStart(2,'0');
  el.clock.textContent = p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}, 1000);

/* ── 리사이즈 ────────────────────────────────────── */
let rz;
addEventListener('resize', ()=>{
  clearTimeout(rz);
  rz = setTimeout(()=>{ sizeBand(); sizeVU(); fitTitle(); }, 120);
});

/* ── 시작 ────────────────────────────────────────── */
sizeBand(); sizeVU();
requestAnimationFrame(loop);
(async ()=>{
  await loadFavs();
  paintTabs();
  load('kr');
})();

})();
</script>
</body>
</html>
